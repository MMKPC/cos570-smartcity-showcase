<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart-City Viewer - Replay</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0c1116; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    font-family: Consolas, monospace; color: #e4eef5; font-size: 20px;
    background: rgba(10,14,18,0.85); padding: 18px 24px; border-radius: 10px;
    line-height: 1.7; pointer-events: none; max-width: 560px;
  }
  #hud b { color: #ffcf6e; font-size: 22px; }
  #hud .stat { color: #8fd9a8; }
</style>
</head>
<body>
<div id="hud">
  <div><b>Smart-City — Optimized Run Replay</b></div>
  <div id="status">Loading simulation output...</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// This viewer does not simulate anything. It only replays exactly what
// sim/run_all.py already computed and logged: real flow-responsive light
// states and real car-release events. If it looks different from before,
// that's because the light timing and car flow are now genuinely the
// output of the Python optimizer, not a guess made in JavaScript.

const ROAD_HALF_WIDTH = 4.5;
const CITY_HALF = 34;
let STOP_MARGIN = ROAD_HALF_WIDTH + 3;
const PLAYBACK_SPEED = 1; // real-time — a 3s green phase now actually shows for 3s

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1116);
scene.fog = new THREE.Fog(0x0c1116, 60, 160);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 65, 78);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 15;
controls.maxDistance = 160;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new THREE.AmbientLight(0x8899aa, 0.7));
const sun = new THREE.DirectionalLight(0xffe9c7, 1.0);
sun.position.set(40, 70, 20);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(CITY_HALF * 2 + 20, CITY_HALF * 2 + 20),
  new THREE.MeshStandardMaterial({ color: 0x1c2b22, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x2a2e33, roughness: 0.9 });
const centerLineMat = new THREE.MeshBasicMaterial({ color: 0xf2d060 });

function addRoad(isVertical, coord) {
  const length = CITY_HALF * 2 + 6;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(isVertical ? ROAD_HALF_WIDTH * 2 : length, 0.2, isVertical ? length : ROAD_HALF_WIDTH * 2),
    roadMat
  );
  mesh.position.set(isVertical ? coord : 0, 0.02, isVertical ? 0 : coord);
  scene.add(mesh);
  const center = new THREE.Mesh(
    new THREE.BoxGeometry(isVertical ? 0.25 : length, 0.22, isVertical ? length : 0.25),
    centerLineMat
  );
  center.position.set(isVertical ? coord : 0, 0.05, isVertical ? 0 : coord);
  scene.add(center);
}

function buildStack(px, pz) {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 6, 8), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  pole.position.set(px, 3, pz);
  scene.add(pole);
  const mkLight = (color, yOffset) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), new THREE.MeshStandardMaterial({ color, emissive: 0x000000 }));
    s.position.set(px, 5.2 + yOffset, pz);
    scene.add(s);
    return s;
  };
  return { red: mkLight(0x550000, 0.9), yellow: mkLight(0x554400, 0), green: mkLight(0x004d1a, -0.9) };
}
function paintStack(stack, state) {
  const off = 0x222222, onR = 0xff2222, onY = 0xffcc22, onG = 0x22ff66;
  stack.red.material.emissive.set(state === "red" ? onR : off);
  stack.yellow.material.emissive.set(state === "yellow" ? onY : off);
  stack.green.material.emissive.set(state === "green" ? onG : off);
}

function seededRand(seed) {
  let a = seed;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = seededRand(7);
const buildingMat = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.8 });

async function main() {
  const res = await fetch("../data/light_schedule.json");
  const data = await res.json();
  const statusEl = document.getElementById("status");

  const V_ROAD_X = [...new Set(data.intersections.map(i => i.x))];
  const H_ROAD_Z = [...new Set(data.intersections.map(i => i.z))];
  V_ROAD_X.forEach(x => addRoad(true, x));
  H_ROAD_Z.forEach(z => addRoad(false, z));

  function onRoad(x, z) {
    return V_ROAD_X.some(rx => Math.abs(x - rx) < ROAD_HALF_WIDTH + 2) ||
           H_ROAD_Z.some(rz => Math.abs(z - rz) < ROAD_HALF_WIDTH + 2);
  }
  for (let x = -CITY_HALF + 4; x < CITY_HALF; x += 6) {
    for (let z = -CITY_HALF + 4; z < CITY_HALF; z += 6) {
      if (onRoad(x, z) || rand() < 0.35) continue;
      const h = 3 + rand() * 14, w = 3 + rand() * 2.5;
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), buildingMat);
      mesh.position.set(x + (rand() - 0.5) * 2, h / 2, z + (rand() - 0.5) * 2);
      scene.add(mesh);
    }
  }

  const intersections = {};
  data.intersections.forEach(it => {
    intersections[it.id] = {
      x: it.x, z: it.z, nsState: "red", ewState: "red",
      stacks: {
        N: buildStack(it.x + ROAD_HALF_WIDTH + 1.2, it.z - STOP_MARGIN),
        S: buildStack(it.x - ROAD_HALF_WIDTH - 1.2, it.z + STOP_MARGIN),
        E: buildStack(it.x + STOP_MARGIN, it.z + ROAD_HALF_WIDTH + 1.2),
        W: buildStack(it.x - STOP_MARGIN, it.z - ROAD_HALF_WIDTH - 1.2),
      },
    };
  });

  // sort logs once, replay by binary-searching the most recent entry <= simTime
  const lightLog = data.light_log;
  const releaseLog = data.release_log;
  let lightIdx = {}, releaseCursor = 0;
  data.intersections.forEach(it => lightIdx[it.id] = 0);

  const pulseMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x333333 });
  const activePulses = [];

  function applyLightLogUpTo(simTime) {
    for (const entry of lightLog) {
      if (entry.t > simTime) break;
      const it = intersections[entry.intersection];
      if (!it) continue;
      it.nsState = entry.ns_state;
      it.ewState = entry.ew_state;
    }
    Object.values(intersections).forEach(it => {
      paintStack(it.stacks.N, it.nsState);
      paintStack(it.stacks.S, it.nsState);
      paintStack(it.stacks.E, it.ewState);
      paintStack(it.stacks.W, it.ewState);
    });
  }

  function spawnPulsesUpTo(simTime) {
    while (releaseCursor < releaseLog.length && releaseLog[releaseCursor].t <= simTime) {
      const ev = releaseLog[releaseCursor];
      const it = intersections[ev.intersection];
      if (it) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.6), pulseMat.clone());
        const travel = 10; // actually crosses the intersection, not a bob-in-place
        let from, to;
        if (ev.axis === "NS") {
          from = new THREE.Vector3(it.x, 0.6, it.z - travel);
          to = new THREE.Vector3(it.x, 0.6, it.z + travel);
          mesh.rotation.y = 0;
        } else {
          from = new THREE.Vector3(it.x - travel, 0.6, it.z);
          to = new THREE.Vector3(it.x + travel, 0.6, it.z);
          mesh.rotation.y = Math.PI / 2;
        }
        mesh.position.copy(from);
        scene.add(mesh);
        activePulses.push({ mesh, born: performance.now(), from, to, life: 1.5 });
      }
      releaseCursor++;
    }
  }

  function tickPulses() {
    const now = performance.now();
    for (let i = activePulses.length - 1; i >= 0; i--) {
      const p = activePulses[i];
      const age = (now - p.born) / 1000;
      const frac = Math.min(age / p.life, 1);
      p.mesh.position.lerpVectors(p.from, p.to, frac);
      if (age > p.life) {
        scene.remove(p.mesh);
        activePulses.splice(i, 1);
      }
    }
  }

  let simTime = 0;
  let lastFrame = performance.now();
  const s = data.summary || {};

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastFrame) / 1000, 0.1);
    lastFrame = now;
    simTime += dt * PLAYBACK_SPEED;
    if (simTime > data.duration_s) { simTime = 0; releaseCursor = 0; }

    applyLightLogUpTo(simTime);
    spawnPulsesUpTo(simTime);
    tickPulses();
    controls.update();

    const perIntersection = Object.entries(intersections)
      .map(([id, it]) => `${id}: NS ${it.nsState.toUpperCase()} / EW ${it.ewState.toUpperCase()}`)
      .join("<br>");

    statusEl.innerHTML =
      `Replaying optimized run, min_green=${data.min_green}s max_green=${data.max_green}s<br>` +
      `Sim time: ${simTime.toFixed(0)}s / ${data.duration_s}s (real-time)<br>` +
      `<span class="stat">Cars released: ${releaseCursor}</span><br><br>` +
      perIntersection;

    renderer.render(scene, camera);
  }
  animate();
}
main().catch(err => {
  document.getElementById("status").textContent =
    "Could not load ../data/light_schedule.json. " + err;
});
</script>
</body>
</html>
